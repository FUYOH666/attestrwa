name: Feature request
description: Propose a feature or enhancement for AttestRWA.
title: "feat: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an idea. Small, composable changes are the easiest to review:
        a new input source, a verifier check, a clarification of the specification.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Record format or specification
        - Library and verifier (packages/attestrwa)
        - Contracts (SettlementEscrow)
        - Attester (apps/api)
        - Web UI (apps/web)
        - Scripts (local fork, deploy, end to end)
        - Docs
        - CI / GitHub config
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve
      description: Describe the gap or pain point first; the solution second.
    validations:
      required: true

  - type: textarea
    id: proposed
    attributes:
      label: Proposed approach
      placeholder: |
        e.g. Let a policy read ERC-7943 canTransfer as an on-chain input.
        e.g. Add `attestation.refUID` linking to a parent batch attestation.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      placeholder: |
        What else did you weigh, and why is the proposed approach better?

  - type: textarea
    id: out-of-scope
    attributes:
      label: Explicit non-goals
      description: |
        Reminder of what AttestRWA does NOT plan to build (see docs/ROADMAP.md).
        Mark anything here that should stay out of scope of the proposal.
