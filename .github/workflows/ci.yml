name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FOUNDRY_VERSION: v1.7.1

jobs:
  hygiene:
    name: Secrets and personal paths
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Secret and personal-path scan
        run: |
          set -u
          fail=0
          if git grep -nE '(^|[^0-9.])100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.[0-9]{1,3}\.[0-9]{1,3}($|[^0-9])' -- ':!*.lock' ':!*-lock.yaml'; then
            echo "::error::Tailscale/CGNAT IP address in tracked files"; fail=1
          fi
          if git grep -nE '/Users/[A-Za-z0-9._-]+/' -- ':!*.lock' ':!*-lock.yaml'; then
            echo "::error::Absolute /Users/<name>/ path in tracked files"; fail=1
          fi
          if git grep -nE 'BEGIN [A-Z ]*PRIVATE KEY|hf_[A-Za-z0-9]{30,}|sk-[A-Za-z0-9_-]{20,}|gh[pousr]_[A-Za-z0-9]{30,}' -- ':!*.lock' ':!*-lock.yaml'; then
            echo "::error::Private key or API token in tracked files"; fail=1
          fi
          if git grep -nE "PRIVATE_KEY[A-Z_]*=[\"']?0x[0-9a-fA-F]{64}" -- ':!*.lock' ':!*-lock.yaml'; then
            echo "::error::A private key literal assigned in tracked files"; fail=1
          fi
          exit "$fail"

  contracts:
    name: Contracts (Foundry)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - name: Install pinned Solidity dependencies
        run: ./scripts/install-contract-deps.sh

      - name: Format check
        working-directory: contracts
        run: forge fmt --check

      - name: Build
        working-directory: contracts
        run: forge build --sizes

      - name: Test (unit, fuzz, invariants against real EAS)
        working-directory: contracts
        run: forge test

  slither:
    name: Contracts (Slither)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - name: Install pinned Solidity dependencies
        run: ./scripts/install-contract-deps.sh

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Slither
        run: pip install slither-analyzer==0.11.5

      - name: Run Slither (fails on medium and above)
        working-directory: contracts
        run: |
          slither src/SettlementEscrow.sol \
            --solc-remaps "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/ @eas/=lib/eas-contracts/contracts/ forge-std/=lib/forge-std/src/" \
            --filter-paths "lib/" \
            --exclude-low \
            --exclude-informational \
            --fail-medium

  library:
    name: Library and verifier (attestrwa)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/attestrwa
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync
        run: uv sync --frozen

      - name: Lint
        run: |
          uvx ruff@0.17.4 check .
          uvx ruff@0.17.4 format --check .

      - name: Test
        run: uv run pytest -q

      - name: Verify the published records offline
        run: |
          set -e
          for record in ../../spec/test-vectors/record-*.json ../../examples/records/*/*.json; do
            [ -f "$record" ] || continue
            echo "== $record"
            uv run attestrwa verify "$record" --offline \
              --policy-dir ../../data/policies --registry ../../data/registry/payees.json
          done

  api:
    name: Attester (FastAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync
        run: uv sync --frozen

      - name: Lint
        run: |
          uvx ruff@0.17.4 check .
          uvx ruff@0.17.4 format --check .

      - name: Test
        run: uv run pytest -q

  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Canonicaliser against the published vectors
        run: pnpm test

      - name: Type check
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build
