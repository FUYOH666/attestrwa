[project]
name = "attestrwa"
version = "2.0.0"
description = "Decision records for compliance-gated settlement: canonical record format, policy rule evaluator, and an independent verifier that checks a record against its on-chain EAS attestation."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Aleksandr Mordvinov" }]
keywords = [
    "attestation",
    "audit-trail",
    "compliance",
    "decision-record",
    "eas",
    "ethereum-attestation-service",
    "policy-as-code",
    "stablecoin",
    "verification",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Topic :: Security",
]
dependencies = [
    "pycryptodome>=3.20",
    "pyyaml>=6.0",
]

[project.urls]
Repository = "https://github.com/FUYOH666/attestrwa"
Specification = "https://github.com/FUYOH666/attestrwa/blob/main/spec/DECISION_RECORD_v0.1.md"
Changelog = "https://github.com/FUYOH666/attestrwa/blob/main/CHANGELOG.md"

[project.scripts]
attestrwa = "attestrwa.cli:main"

[dependency-groups]
dev = [
    "jsonschema>=4.21",
    "pytest>=8",
    "rfc8785>=0.1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/attestrwa"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
